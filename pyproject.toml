[project]
name = "epskel"
version = "0.1.0"
description = "EP-SKEL skeleton corpus generation (NCN SONATA, AI-based Bulk Surveillance)"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.60",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "sentence-transformers>=3.0",
    "torch>=2.4",
    "scikit-learn>=1.5",
    "httpx>=0.27",
    "tabulate>=0.10.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["epskel"]
