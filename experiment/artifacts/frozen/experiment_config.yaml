# EP-SKEL selection experiment configuration (plan sections 4, 7-10).
corpus:
  eval_dir: ../corpus/epskel_v1          # posts_v1.csv, authors_v1.csv, arc_key_v1.csv
  eval_version: v2          # v1 + PI corrections 2026-10-13; author/post ids re-drawn (map: author_id_map_v2.csv)
  dev_dir: ../corpus/epskel_dev_v1
  dev_version: dev2         # dev corpus + TA-05/TB-09 with their own persona cards and seed (build_dev_arcs.py)
  arc_split: configs/arc_split.yaml

budgets: [0.01, 0.05, 0.20]
tie_seeds: [0, 1, 2]
rand_seeds: [0, 1, 2, 3, 4]
aggregation:
  kind: top_k_sum
  k: 3

selectors:
  s0:
    lexicon: artifacts/s0_lexicon.yaml
    weights: {A: 3, B: 2, C: 2, D: 1, AB_proximity: 2, ABC_same_sentence: 1, E: 4}
    proximity_tokens: 10
    variants: [sub, veto]
  s1:
    seeds: artifacts/s1_seeds.yaml
    embedding_model: qwen/qwen3-embedding-8b     # plan Annex H candidate; via OpenRouter
    d3_vec_alpha: 0.5
  s3:
    open_model: deepseek/deepseek-v4.1-flash     # S3-open, chosen on the dev sample (model-trial); open weights, cheap
    open_candidates: [deepseek/deepseek-v4.1-flash, z-ai/glm-5.3-flash, qwen/qwen3.8-27b, moonshotai/kimi-k3]
    control_model: google/gemini-3.1-pro-preview   # S3-com: PI/Kacper decision 2026-10-24, commercial model from the XAI study set
    control_fraction: 0.10
    temperature: 0.0
    determinism_repeats: 2
    prompt_d0: s3_d0_v1
    prompt_d3nat: s3_d3nat_v1
    prompt_blind_d0: s3_blind_d0_v1
    prompt_blind_d3nat: s3_blind_d3nat_v1
    max_history_posts: 40
    workers: 8
    # providers that return decision-token logprobs for the open model (checked 2026-10-08: Together, DigitalOcean,
    # Novita, StreamLake do; Morph, Relace, AtlasCloud, Parasail, Alibaba, Venice, BaseTen do not)
    provider_order:
      deepseek/deepseek-v4.1-flash: [Together, DigitalOcean, Novita]

results_dir: results
